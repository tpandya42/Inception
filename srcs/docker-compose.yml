version: "3.8"

volumes:
  wordpress_db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/mariadb
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/wordpress
  
networks:
  inception:

services:
  nginx:
    build: ./requirements/nginx/.
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_files:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/index.php && echo | openssl s_client -connect 127.0.0.1:443 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mariadb:
    build: ./requirements/mariadb/.
    container_name: mariadb
    image: mariadb
    env_file: .env
    restart: always
    volumes:
      - wordpress_db:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --socket=/run/mysqld/mysqld.sock -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
  
  wordpress:
    build: ./requirements/wordpress/.
    container_name: wordpress
    image: wordpress
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - inception
    volumes:
       - wordpress_files:/var/www/html
    healthcheck:
      test:
        - CMD-SHELL
        - >
          test -f /var/www/html/wp-config.php
          && php-fpm8.2 -t >/dev/null 2>&1
          && php -r 'exit(@mysqli_connect("mariadb", getenv("MYSQL_USER"), getenv("MYSQL_PASSWORD"), getenv("MYSQL_DATABASE")) ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
